<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>{% block title %}Operations - PQBank{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/ops.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/ops-enhanced.css') }}"></head>
<body class="ops-page" data-page="{{ page }}"><div class="app-shell"><header class="topbar"><a class="brand" href="{{ '/admin' if console == 'ADMIN CONSOLE' else '/security' }}"><span class="brand-mark">PQ</span><span>PQBank</span></a><span class="console-label">{{ console }}</span><nav class="main-nav"><a href="{{ '/admin' if console == 'ADMIN CONSOLE' else '/security' }}">Overview</a>{% if console == 'ADMIN CONSOLE' %}<a href="/admin/users">Users</a><a href="/admin/transactions">Transactions</a><a href="/admin/audit">Audit</a><a href="/security/audit">Security audit</a><a href="/security/lab">Demo lab</a>{% else %}<a href="/security/aqrs">AQRS</a><a href="/security/crypto">Crypto</a><a href="/security/blockchain">Blockchain</a><a href="/security/audit">Audit</a><a href="/security/lab">Demo lab</a>{% endif %}<a href="/account/security">Security settings</a></nav><div class="user-menu"><span id="ops-user">Loading</span><button class="button button-quiet" id="logout-button" type="button">Log out</button></div></header><main class="page-wrap">{% block content %}{% endblock %}</main></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="{{ url_for('static', filename='js/ops.js') }}" defer></script><script src="{{ url_for('static', filename='js/ops-enhanced.js') }}" defer></script></body></html>
